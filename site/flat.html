<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swiss Law Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Zoomable map of Swiss law: SR areas, acts, articles and the court decisions that cite them, every number computed from OpenCaseLaw and Fedlex.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a full-bleed map is the page; search, legend and the reading panel float over it. */
:root {
  --bg: #eef1f3;          /* map ground, cool paper */
  --surface: #fbfcfd;     /* floating panels */
  --fg: #172026;          /* ink */
  --muted: #5d6b75;
  --line: #d3dade;
  --halo: #eef1f3;        /* text halo on the map */
  --focus: #1b5fd6;
  --d1: #4c6fcf; --d2: #17917f; --d3: #c4472f; --d4: #8a5cc8; --d5: #6b7a2a;
  --d6: #c58510; --d7: #2c82b5; --d8: #c74f7d; --d9: #3c9650; --dk: #8a6a49; --dn: #6f7c86;
  --font-display: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --panel-w: 400px;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1317; --surface: #151d22; --fg: #e4eaee; --muted: #8e9ba4; --line: #2a353c; --halo: #0d1317;
    --focus: #7fb0ff;
    --d1: #7d9bf0; --d2: #3fc2ad; --d3: #f0765b; --d4: #b18cf0; --d5: #a6b55a;
    --d6: #f0b440; --d7: #5bb3e6; --d8: #ee7fa8; --d9: #6cc67c; --dk: #c49a6c; --dn: #8e9ba4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1317; --surface: #151d22; --fg: #e4eaee; --muted: #8e9ba4; --line: #2a353c; --halo: #0d1317;
  --focus: #7fb0ff;
  --d1: #7d9bf0; --d2: #3fc2ad; --d3: #f0765b; --d4: #b18cf0; --d5: #a6b55a;
  --d6: #f0b440; --d7: #5bb3e6; --d8: #ee7fa8; --d9: #6cc67c; --dk: #c49a6c; --dn: #8e9ba4;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }
#map.pointing { cursor: pointer; }

.float { background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: 0 6px 24px rgb(0 0 0 / 0.08); backdrop-filter: blur(10px); }

/* Top bar */
#top { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); width: min(440px, calc(100% - 32px));
  display: flex; flex-direction: column; gap: 8px; }
#bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; }
#brand { font: 700 15px/1.1 var(--font-display); letter-spacing: -0.01em; white-space: nowrap; }
#brand small { display: block; font: 500 10.5px/1.3 var(--font-data); color: var(--muted); letter-spacing: 0.02em; }
#search { flex: 1; min-width: 0; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px;
  background: var(--bg); color: var(--fg); font: 14px var(--font-body); }
#search::placeholder { color: var(--muted); }
#results { max-height: min(60vh, 460px); overflow-y: auto; padding: 4px; }
#results button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left;
  border: 0; background: none; color: var(--fg); padding: 7px 10px; border-radius: 7px; cursor: pointer; font: inherit; }
#results button[aria-selected="true"], #results button:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
#results .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#results .s { grid-column: 1; color: var(--muted); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#results .n { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 12px var(--font-data); color: var(--muted); }
#results .empty { padding: 10px; color: var(--muted); }
#crumbs { display: flex; flex-wrap: wrap; gap: 2px 4px; padding: 0 4px; font-size: 12.5px; color: var(--muted); }
#crumbs button { border: 0; background: none; color: inherit; padding: 1px 3px; border-radius: 4px; cursor: pointer; font: inherit;
  text-shadow: 0 0 4px var(--halo), 0 0 2px var(--halo); }
#crumbs button:hover { color: var(--fg); }
#crumbs span { opacity: 0.6; }

.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 7px;
  height: 30px; padding: 0 9px; font: 500 12.5px var(--font-body); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
select.chip { padding-right: 4px; }

/* Bottom-left tools */
#tools { position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
#toolrow { display: flex; gap: 6px; flex-wrap: wrap; }
#legend { padding: 8px 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 14px; max-width: 360px; }
#legend button { display: flex; align-items: center; gap: 7px; border: 0; background: none; color: var(--fg); padding: 2px 0;
  font: 12px/1.25 var(--font-body); text-align: left; cursor: pointer; min-width: 0; }
#legend button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#legend i { flex: none; width: 10px; height: 10px; border-radius: 50%; }
#legend .note { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; margin-top: 4px; }
#period { padding: 10px 12px; display: grid; gap: 6px; width: min(330px, calc(100vw - 32px)); }
#period label { display: grid; grid-template-columns: 34px 1fr 44px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
#period output { font: 12px var(--font-data); color: var(--fg); text-align: right; }
#period input { width: 100%; accent-color: var(--fg); }
#period p { margin: 0; font-size: 11.5px; color: var(--muted); }

/* Reading panel */
#panel { position: fixed; z-index: 6; top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: var(--panel-w); display: flex; flex-direction: column; overflow: hidden; }
#panel header { display: flex; align-items: flex-start; gap: 8px; padding: 14px 14px 10px 16px; border-bottom: 1px solid var(--line); }
#panel header div { flex: 1; min-width: 0; }
#panel .eyebrow { font: 500 11px/1.3 var(--font-data); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
#panel h2 { margin: 3px 0 0; font: 700 21px/1.18 var(--font-display); letter-spacing: -0.015em; text-wrap: balance; overflow-wrap: anywhere; }
#panel .sub { margin: 5px 0 0; color: var(--muted); font-size: 13px; text-wrap: pretty; }
#close { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--fg); cursor: pointer; font-size: 17px; line-height: 1; }
#pbody { overflow-y: auto; padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 16px; }
#pbody section { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#pbody h3 { margin: 10px 0 0; font: 600 11.5px/1.3 var(--font-data); color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
.big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big b { font: 600 28px/1 var(--font-data); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); font-size: 13px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; }
.list li:first-child { border-top: 0; }
.list .k { min-width: 0; overflow-wrap: anywhere; }
.list .v { font: 12px var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.list .d { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.link { color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--fg); }
button.link { border: 0; background: none; padding: 0; font: inherit; cursor: pointer; text-align: left; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; text-wrap: pretty; }
.bar { height: 4px; background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: 2px; overflow: hidden; grid-column: 1 / -1; }
.bar i { display: block; height: 100%; background: var(--hue, var(--fg)); }
.spark { width: 100%; height: 64px; display: block; }
.mono { font-family: var(--font-data); }
.pill { display: inline-block; font: 500 11px/1.6 var(--font-data); padding: 0 6px; border-radius: 4px;
  background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--muted); }

/* Tooltip */
#tip { position: fixed; z-index: 7; pointer-events: none; padding: 6px 9px; font-size: 12.5px; max-width: 300px; }
#tip b { font-weight: 600; }
#tip span { display: block; color: var(--muted); font: 11.5px var(--font-data); }

/* Method dialog */
#method { position: fixed; z-index: 9; inset: 0; display: grid; place-items: center; padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 70%, transparent); }
#method .float { width: min(760px, 100%); max-height: 100%; overflow-y: auto; padding: 22px 26px 28px; }
#method h2 { font: 700 24px/1.2 var(--font-display); margin: 0 0 6px; letter-spacing: -0.015em; }
#method h3 { font: 600 15px/1.3 var(--font-display); margin: 22px 0 6px; }
#method p, #method li { max-width: 68ch; text-wrap: pretty; }
#method table { border-collapse: collapse; width: 100%; font-size: 13px; }
#method td, #method th { padding: 4px 8px 4px 0; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
#method td.r, #method th.r { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
#method .tw { overflow-x: auto; }
#method .x { float: right; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font: 13px var(--font-data); pointer-events: none; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

@media (max-width: 760px) {
  :root { --panel-w: auto; }
  #top { width: calc(100% - 32px); }
  #brand small { display: none; }
  #panel { top: auto; left: max(16px, env(safe-area-inset-left, 0px)); height: min(52vh, 460px); }
  #legend { display: none; }
  #legend.open { display: grid; }
  #tools.raised { bottom: calc(min(52vh, 460px) + 26px + env(safe-area-inset-bottom, 0px)); }
  #panel h2 { font-size: 19px; }
  #crumbs { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="map" aria-label="Map of Swiss law" role="img"></canvas>
<div id="loading">Swiss Law Map …</div>

<div id="top">
  <div id="bar" class="float">
    <div id="brand"><span id="brandname">Swiss Law Map</span><small id="brandsub">SR · Fedlex · OpenCaseLaw</small></div>
    <input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="Search">
    <select id="lang" class="chip" aria-label="Language">
      <option value="de">DE</option><option value="fr">FR</option><option value="it">IT</option><option value="en">EN</option>
    </select>
  </div>
  <div id="results" class="float" role="listbox" hidden></div>
  <nav id="crumbs" aria-label="Path"></nav>
</div>

<div id="tools">
  <div id="period" class="float" hidden>
    <label><span id="l-from">Von</span><input id="y0" type="range" min="1875" max="2026" value="1875"><output id="o0">1875</output></label>
    <label><span id="l-to">Bis</span><input id="y1" type="range" min="1875" max="2026" value="2026"><output id="o1">2026</output></label>
    <p id="periodnote"></p>
  </div>
  <div id="legend" class="float"></div>
  <div id="toolrow">
    <button class="chip" id="zin" aria-label="Zoom in">+</button>
    <button class="chip" id="zout" aria-label="Zoom out">−</button>
    <button class="chip" id="home"></button>
    <button class="chip" id="periodbtn" aria-pressed="false"></button>
    <button class="chip" id="legendbtn" aria-pressed="false"></button>
    <button class="chip" id="methodbtn"></button>
  </div>
</div>

<aside id="panel" class="float" hidden aria-live="polite">
  <header><div id="phead"></div><button id="close" aria-label="Close">×</button></header>
  <div id="pbody"></div>
</aside>

<div id="tip" class="float" hidden></div>
<div id="method" hidden><div class="float" role="dialog" aria-modal="true" aria-labelledby="mtitle" id="mbox"></div></div>

<script src="app.js"></script>
</body>
</html>
